{{- if .Values.quota.enabled }}
# 학습자 pod 폭주로부터 노드/클러스터 격리.
# 산정: (session.max + warmPool.max + 여유) × learner requests — values 주석 참고
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "snacklab.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snacklab.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
{{- end }}
{{- if .Values.limitRange.enabled }}
---
# ResourceQuota는 requests 미명시 pod 생성을 거부하므로 기본값을 부여해
# 네임스페이스 내 전 pod가 quota에 계상되게 한다.
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "snacklab.fullname" . }}-defaults
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snacklab.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml .Values.limitRange.defaultRequest | nindent 8 }}
      default:
        {{- toYaml .Values.limitRange.default | nindent 8 }}
{{- end }}
