{{- if and (eq .Values.auth.mode "local") (not .Values.auth.usersExistingSecret) }}
# 초기 관리자 비밀번호 — users.json이 아직 없을 때(첫 기동)만 쓰인다.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snacklab.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snacklab.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.adminPassword | default "ChangeMe" | quote }}
{{- end }}
