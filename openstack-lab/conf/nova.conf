[DEFAULT]
# No metadata API: fake instances never call it, and dropping it saves a worker.
enabled_apis = osapi_compute
transport_url = rabbit://guest:guest@127.0.0.1:5672/
my_ip = 127.0.0.1
state_path = /var/lib/nova
osapi_compute_workers = 1
metadata_workers = 1
# The fake driver never plugs VIFs, so the network-vif-plugged event never
# arrives — without these two settings every boot would end in ERROR.
vif_plugging_is_fatal = false
vif_plugging_timeout = 5

[api]
auth_strategy = keystone

[api_database]
connection = mysql+pymysql://nova:snacklab@127.0.0.1/nova_api

[database]
connection = mysql+pymysql://nova:snacklab@127.0.0.1/nova

[keystone_authtoken]
www_authenticate_uri = http://127.0.0.1:5000
auth_url = http://127.0.0.1:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = nova
password = snacklab

[placement]
auth_url = http://127.0.0.1:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = placement
password = snacklab
region_name = RegionOne

[neutron]
auth_url = http://127.0.0.1:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = neutron
password = snacklab
region_name = RegionOne

[scheduler]
# Auto-register the (fake) compute host shortly after first boot — replaces a
# manual `nova-manage cell_v2 discover_hosts`.
discover_hosts_in_cells_interval = 30

[conductor]
workers = 1

[oslo_concurrency]
lock_path = /var/lib/nova/tmp

[oslo_messaging_notifications]
driver = noop
