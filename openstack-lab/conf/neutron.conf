[DEFAULT]
core_plugin = ml2
service_plugins = router
transport_url = rabbit://guest:guest@127.0.0.1:5672/
auth_strategy = keystone
api_workers = 1
rpc_workers = 1
notify_nova_on_port_status_changes = true
notify_nova_on_port_data_changes = true

[database]
connection = mysql+pymysql://neutron:snacklab@127.0.0.1/neutron

[keystone_authtoken]
www_authenticate_uri = http://127.0.0.1:5000
auth_url = http://127.0.0.1:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = neutron
password = snacklab

[nova]
auth_url = http://127.0.0.1:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = nova
password = snacklab
region_name = RegionOne

[oslo_concurrency]
lock_path = /var/lib/neutron/tmp

# Ubuntu's neutron_sudoers only whitelists neutron-rootwrap(-daemon), so both
# rootwrap and privsep escalation must go through it — with a bare
# `sudo privsep-helper` the agents die (and busy-loop retrying, measured
# ~1.2 cores of pure sudo-denial churn).
[agent]
root_helper = sudo /usr/bin/neutron-rootwrap /etc/neutron/rootwrap.conf
root_helper_daemon = sudo /usr/bin/neutron-rootwrap-daemon /etc/neutron/rootwrap.conf

[privsep]
helper_command = sudo /usr/bin/neutron-rootwrap /etc/neutron/rootwrap.conf privsep-helper

[oslo_messaging_notifications]
driver = noop
