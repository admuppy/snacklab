# Single-host ML2: tenant networks use the 'local' type (no tunnels, no
# local_ip, hostname-independent), provider/external networks are flat on
# physnet1 (mapped to br-ex by the OVS agent).
[ml2]
type_drivers = flat,vlan,local
tenant_network_types = local
mechanism_drivers = openvswitch
extension_drivers = port_security

[ml2_type_flat]
flat_networks = physnet1

[ml2_type_vlan]
network_vlan_ranges = physnet1

[securitygroup]
enable_security_group = true
